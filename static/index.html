<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio Optimizer</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <main class="container">
    <section class="hero">
      <p class="eyebrow">MARKOWITZ PORTFOLIO OPTIMIZER</p>
      <h1>Efficient Frontier</h1>
      <p class="subtitle">
        Pick assets, fetch historical prices and calculate long-only
        minimum-variance and maximum-Sharpe portfolios.
      </p>
    </section>

    <section class="panel controls">
      <label>
        Tickers
        <input id="tickers" value="AAPL, MSFT, SPY, GLD" placeholder="AAPL, MSFT, SPY">
      </label>

      <div class="grid">
        <label>
          History
          <select id="years">
            <option value="1">1 year</option>
            <option value="3">3 years</option>
            <option value="5" selected>5 years</option>
            <option value="10">10 years</option>
          </select>
        </label>

        <label>
          Risk-free rate, %
          <input id="rf" type="number" step="0.1" value="3">
        </label>
      </div>

      <button id="run">Optimize portfolio</button>
      <p id="status"></p>
    </section>

    <section id="results" class="hidden">
      <div class="cards">
        <article class="metric">
          <span>Expected return</span>
          <strong id="ret">—</strong>
        </article>
        <article class="metric">
          <span>Volatility</span>
          <strong id="vol">—</strong>
        </article>
        <article class="metric">
          <span>Sharpe ratio</span>
          <strong id="sharpe">—</strong>
        </article>
      </div>

      <section class="panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">MAX SHARPE</p>
            <h2>Portfolio weights</h2>
          </div>
          <span id="period"></span>
        </div>
        <div id="weights"></div>
      </section>

      <section class="panel">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">RISK / RETURN</p>
            <h2>Efficient frontier</h2>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="frontierChart"></canvas>
        </div>
      </section>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
